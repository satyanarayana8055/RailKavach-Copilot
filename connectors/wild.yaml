product_id: "wild_wheel_impact_detector"
display_name: "Wheel Impact Load Detector (WILD)"
version: "1.0.0"
category: "TRACKSIDE_AXLE_SENSOR"
modality: "SENSOR_TELEMETRY"
endpoint:
  url: "local://data/wild_telemetry.json"
  auth_type: "none"
  timeout_seconds: 5
query_capabilities:
  can_filter_by_train: true
  can_filter_by_wagon: true
  can_filter_by_min_impact: true
gemini_tool_definition:
  name: "query_wild_wheel_impact_data"
  description: "Queries Wheel Impact Load Detector (WILD) telemetry. Returns axle loads and dynamic wheel impact force measurements in kiloNewtons (kN) to detect flat tyres and brake binding."
  parameters:
    type: "object"
    properties:
      train_no:
        type: "string"
        description: "Train number or rake ID (e.g., '12414', 'BOXN-542')"
      wagon_no:
        type: "string"
        description: "Optional specific wagon serial number"
      min_impact_kn:
        type: "number"
        description: "Filter dynamic impact threshold in kN (e.g. 200 kN)"
    required: ["train_no"]
ui_rendering:
  badge_color: "#E65100"
  icon: "disc"
  primary_metric: "impact_kn"
  metric_unit: "kN"
  threshold_alert: 200.0
